<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | ResumeAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card card">
        <div class="auth-header">
          <a href="/" class="brand">ResumeAI</a>
          <h1>Create account</h1>
          <p>Build a stronger, smarter resume strategy.</p>
        </div>

        <form id="registerForm" class="auth-form">
          <label>
            <span>Full Name</span>
            <input type="text" id="registerName" placeholder="Your full name" required />
          </label>
          <label>
            <span>Email</span>
            <input type="email" id="registerEmail" placeholder="you@example.com" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" id="registerPassword" placeholder="Min 6 characters" required />
          </label>
          <label>
            <span>Confirm Password</span>
            <input type="password" id="registerConfirmPassword" placeholder="Confirm password" required />
          </label>
          <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>

        <p class="switch-link">Already registered? <a href="/login">Login</a></p>
      </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
